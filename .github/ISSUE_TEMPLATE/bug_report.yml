name: Bug report
description: Something doesn't work the way the docs say it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report this! Please **never paste API keys, tokens or other secrets** in an issue.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Relevant log output (redact anything private). This will be formatted as code.
      render: shell
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "macOS version, Python version, browser/device you opened the dashboard from"
    validations:
      required: true
